<div class="checkout-container">
  <h1 class="mb-4">Finalizar Compra</h1>

  <div class="row">
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Endereço de Entrega</h5>
          
          <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="street" class="form-label">Endereço</label>
              <input type="text" class="form-control" id="street" formControlName="street" 
                [ngClass]="{ 'is-invalid': submitted && f['street'].errors }">
              <div *ngIf="submitted && f['street'].errors" class="invalid-feedback">
                <div *ngIf="f['street'].errors['required']">Endereço é obrigatório</div>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="city" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="city" formControlName="city" 
                  [ngClass]="{ 'is-invalid': submitted && f['city'].errors }">
                <div *ngIf="submitted && f['city'].errors" class="invalid-feedback">
                  <div *ngIf="f['city'].errors['required']">Cidade é obrigatória</div>
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="state" class="form-label">Estado</label>
                <input type="text" class="form-control" id="state" formControlName="state" 
                  [ngClass]="{ 'is-invalid': submitted && f['state'].errors }">
                <div *ngIf="submitted && f['state'].errors" class="invalid-feedback">
                  <div *ngIf="f['state'].errors['required']">Estado é obrigatório</div>
                </div>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="country" class="form-label">País</label>
                <input type="text" class="form-control" id="country" formControlName="country" 
                  [ngClass]="{ 'is-invalid': submitted && f['country'].errors }">
                <div *ngIf="submitted && f['country'].errors" class="invalid-feedback">
                  <div *ngIf="f['country'].errors['required']">País é obrigatório</div>
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="zipCode" class="form-label">CEP</label>
                <input type="text" class="form-control" id="zipCode" formControlName="zipCode" 
                  [ngClass]="{ 'is-invalid': submitted && f['zipCode'].errors }">
                <div *ngIf="submitted && f['zipCode'].errors" class="invalid-feedback">
                  <div *ngIf="f['zipCode'].errors['required']">CEP é obrigatório</div>
                  <div *ngIf="f['zipCode'].errors['pattern']">CEP inválido</div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a [routerLink]="['/cart']" class="btn btn-outline-secondary">Voltar ao Carrinho</a>
              <button type="submit" class="btn btn-primary" [disabled]="processing">
                <span *ngIf="processing" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Finalizar Pedido
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Resumo do Pedido</h5>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <span>Subtotal</span>
            <span>${{ getTotal().toFixed(2) }}</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span>Frete</span>
            <span>Grátis</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <strong>Total</strong>
            <strong>${{ getTotal().toFixed(2) }}</strong>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
